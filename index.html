<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HippoWeather Vue</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body :class="{ 'forecast-page': currentView === 'forecast' }">
    <div id="app">
      <nav class="home-nav" v-if="currentView === 'home'">
        <a href="#" class="nav-link" @click.prevent="currentView = 'home'"
          >Home</a
        >
        <a href="#" class="nav-link" @click.prevent="searchCity">Forecast</a>
      </nav>

      <div class="home-container" v-if="currentView === 'home'">
        <h1 class="header-text" style="margin-top: 50px">HIPPOWEATHER</h1>

        <div class="banner-wrapper">
          <img src="banner.png" alt="Hippo God" class="banner-img" />
        </div>

        <div class="controls-area">
          <div class="input-box dropdown-wrapper">
            <select
              v-model="selectedCity"
              @change="searchCity"
              style="
                width: 100%;
                background: transparent;
                border: none;
                font-size: 1.1rem;
                outline: none;
              "
            >
              <option value="">Оберіть місто...</option>
              <option value="Kyiv">Київ</option>
              <option value="Lviv">Львів</option>
              <option value="Odessa">Одеса</option>
              <option value="Kharkiv">Харків</option>
              <option value="Dnipro">Дніпро</option>
            </select>
          </div>

          <div class="input-box search-wrapper">
            <input
              type="text"
              class="search-field"
              placeholder="Пошук (напр. Харків)"
              v-model="searchQuery"
              @keyup.enter="searchCity"
            />
            <span
              class="search-icon"
              @click="searchCity"
              style="cursor: pointer"
              >🔍</span
            >
          </div>
        </div>

        <a href="game.html" class="footer footer-link">
          <span class="globe-icon">🎮</span>
          <span>Перейти до інтерактивної гри!</span>
        </a>
      </div>

      <div class="forecast-container" v-if="currentView === 'forecast'">
        <div class="forecast-header-strip">
          <h1 class="header-text">HippoWeather</h1>
        </div>

        <div class="sub-nav-bar">
          <a href="#" class="sub-link" @click.prevent="currentView = 'home'"
            >Home</a
          >
          <span class="sub-link active">Forecast</span>
        </div>

        <div class="city-display-wrapper">
          <div class="city-pill"><span>🌍</span> м. {{ displayCity }}</div>
        </div>

        <div class="cards-grid">
          <p v-if="loading" style="color: white; font-size: 2rem">
            Завантаження...
          </p>

          <div
            v-else
            class="weather-card"
            v-for="day in weatherList"
            :key="day.dt"
          >
            <div class="card-icon-box">
              <img :src="getImagePath(day.weather[0].main)" alt="icon" />
            </div>

            <div class="card-details">
              <div class="day-title">{{ formatDay(day.dt) }}</div>
              <div class="temps">
                <div class="temp-col">
                  <span>max</span>
                  <span class="temp-num"
                    >{{ Math.round(day.main.temp_max) }}°</span
                  >
                </div>
                <div class="temp-col">
                  <span>min</span>
                  <span class="temp-num"
                    >{{ Math.round(day.main.temp_min) }}°</span
                  >
                </div>
              </div>
            </div>
          </div>
        </div>

        <a href="game.html" class="footer footer-link" style="color: white">
          <span class="globe-icon">🎮</span>
          <span style="color: white">Перейти до інтерактивної гри!</span>
        </a>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
